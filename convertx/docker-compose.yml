services:
  convertx: 
    image: ghcr.io/c4illin/convertx:v0.20.0@sha256:6259e0c1e063120b1ddbc6937372a83be58182b2c9dc82264f58e100907b3e51
    labels:
      - traefik.enable=true
      - traefik.http.services.convertx.loadbalancer.server.port=3000
      - show.external=true
    container_name: convertx
    user: 9001:9001
    restart: unless-stopped
    environment:
      - HTTP_ALLOWED=true
      - ALLOW_UNAUTHENTICATED=true
    volumes:
      - ./data:/app/data
networks:
  default:
    external: true
    name: ctr-network