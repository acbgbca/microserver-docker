---
services:
  freshrss:
    image: freshrss/freshrss:1.31.0@sha256:31b0acfcb8e11600aa6ce697ff8d9d7ea620c85d766e5e764f487b433d20d066
    container_name: freshrss
    labels:
      - traefik.enable=true
      - traefik.http.services.freshrss.loadbalancer.server.port=80
      - traefik.http.routers.freshrss.rule=Host(`freshrss.$DOMAIN`)
      - show.external=true
    environment:
      - TZ="Australia/Melbourne"
      - CRON_MIN=1,31
    volumes:
      - './data:/var/www/FreshRSS/data'
      - './extensions:/var/www/FreshRSS/extensions'
    restart: 'unless-stopped'
  rssbridge:
    image: rssbridge/rss-bridge@sha256:a543223e151d0a3eb0ffbcadd58e5352f9cfe706e1cc3c5e198786a674e4673f
    container_name: rssbridge
    labels:
      - traefik.enable=true
      - traefik.http.services.rssbridge.loadbalancer.server.port=80
      - show.external=true
    volumes:
      - ./bridge:/config
    restart: unless-stopped
    networks:
      default:
        aliases:
          - rssbridge.$DOMAIN # So I can copy and paste the URLs without needing to change the host
  playwrightproxy:
    image: ghcr.io/acbgbca/pw-scraper:0.235@sha256:4165b0bfa7f26b555ec543aaac8a3d79a830bbf81e7ae79f33db774149140823
    container_name: playwrightproxy
    environment:
      - LOG_LEVEL="debug"
    labels:
      - traefik.enable=true
      - traefik.http.services.playwrightproxy.loadbalancer.server.port=8080
      - show.external=true
    restart: unless-stopped
  redlib:
    image: ghcr.io/itsjfx/redlib:latest@sha256:9cc19443dbb8d4584affeb2f07bc78f35458744e441cf858ee71e4cda564bcd5
    container_name: redlib
    labels:
      - traefik.enable=true
      - traefik.http.services.redlib.loadbalancer.server.port=8080
      - show.external=true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file: redlib.env
    restart: unless-stopped
    networks:
      default:
        aliases:
          - redlib.$DOMAIN # So I can copy and paste the URLs without needing to change the host

networks:
  default:
    external: true
    name: ctr-network