---
services:
  freshrss:
    image: freshrss/freshrss:1.30.1@sha256:48b63b9bc3d042a1301c32971b01af8841c7f059b452589c5bf77f475ba44c61
    container_name: freshrss
    labels:
      - traefik.enable=true
      - traefik.http.services.freshrss.loadbalancer.server.port=80
      - traefik.http.routers.freshrss.rule=Host(`freshrss.$DOMAIN`)
      - show.external=true
    environment:
      - TZ="Australia/Melbourne"
      - CRON_MIN=1,31
    volumes:
      - './data:/var/www/FreshRSS/data'
      - './extensions:/var/www/FreshRSS/extensions'
    restart: 'unless-stopped'
  rssbridge:
    image: rssbridge/rss-bridge@sha256:239c81e07fb09a3222970cc94c32581ff82635bf0252813a6f4ee876251ee39f
    container_name: rssbridge
    labels:
      - traefik.enable=true
      - traefik.http.services.rssbridge.loadbalancer.server.port=80
      - show.external=true
    volumes:
      - ./bridge:/config
    restart: unless-stopped
    networks:
      default:
        aliases:
          - rssbridge.$DOMAIN # So I can copy and paste the URLs without needing to change the host
  playwrightproxy:
    image: ghcr.io/acbgbca/pw-scraper:0.228@sha256:152e7283011463ce0470cff81b28472477a2057591f6d6d7a685466f2f85d755
    container_name: playwrightproxy
    environment:
      - LOG_LEVEL="debug"
    labels:
      - traefik.enable=true
      - traefik.http.services.playwrightproxy.loadbalancer.server.port=8080
      - show.external=true
    restart: unless-stopped
  redlib:
    image: ghcr.io/itsjfx/redlib:latest@sha256:3f4d65903bf52b56f2f932e0140c822f58ec7511a54058ce1ad5b217ba1ed3bd
    container_name: redlib
    labels:
      - traefik.enable=true
      - traefik.http.services.redlib.loadbalancer.server.port=8080
      - show.external=true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file: redlib.env
    restart: unless-stopped
    networks:
      default:
        aliases:
          - redlib.$DOMAIN # So I can copy and paste the URLs without needing to change the host

networks:
  default:
    external: true
    name: ctr-network