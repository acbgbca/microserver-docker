---
services:
  freshrss:
    image: freshrss/freshrss:1.30.2@sha256:a4a4a2233c082940b3ed5a32e2bf12d6c5271062be7e34c188dec99816540fc4
    container_name: freshrss
    labels:
      - traefik.enable=true
      - traefik.http.services.freshrss.loadbalancer.server.port=80
      - traefik.http.routers.freshrss.rule=Host(`freshrss.$DOMAIN`)
      - show.external=true
    environment:
      - TZ="Australia/Melbourne"
      - CRON_MIN=1,31
    volumes:
      - './data:/var/www/FreshRSS/data'
      - './extensions:/var/www/FreshRSS/extensions'
    restart: 'unless-stopped'
  rssbridge:
    image: rssbridge/rss-bridge@sha256:51c31a98c02be55bc7f1f1cc616c32189ffe93a010a765f8ff8c9ea40c8f55eb
    container_name: rssbridge
    labels:
      - traefik.enable=true
      - traefik.http.services.rssbridge.loadbalancer.server.port=80
      - show.external=true
    volumes:
      - ./bridge:/config
    restart: unless-stopped
    networks:
      default:
        aliases:
          - rssbridge.$DOMAIN # So I can copy and paste the URLs without needing to change the host
  playwrightproxy:
    image: ghcr.io/acbgbca/pw-scraper:0.230@sha256:346982b6e9eab3ad6abd62d410bdaa4324028b34b281ba16ca8b1ca4650358d8
    container_name: playwrightproxy
    environment:
      - LOG_LEVEL="debug"
    labels:
      - traefik.enable=true
      - traefik.http.services.playwrightproxy.loadbalancer.server.port=8080
      - show.external=true
    restart: unless-stopped
  redlib:
    image: ghcr.io/itsjfx/redlib:latest@sha256:49fd0ef642e4af6bb41c0e3c7427e45efa4dad5f738fc0f434e7b46dd97000ae
    container_name: redlib
    labels:
      - traefik.enable=true
      - traefik.http.services.redlib.loadbalancer.server.port=8080
      - show.external=true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file: redlib.env
    restart: unless-stopped
    networks:
      default:
        aliases:
          - redlib.$DOMAIN # So I can copy and paste the URLs without needing to change the host

networks:
  default:
    external: true
    name: ctr-network