---
services:
  speedtest:
    image: openspeedtest/latest:latest@sha256:ba63bc8396e5ea334b58b96d925cd173957649935abb88efc9d8ada112cc45f8
    container_name: speedtest
    labels:
      - traefik.enable=true
      - traefik.http.services.speedtest.loadbalancer.server.port=3000
      - traefik.http.middlewares.limit.buffering.maxRequestBodyBytes=10000000000
      - traefik.http.routers.speedtest.middlewares=limit
      - show.external=true
    restart: unless-stopped
networks:
  default:
    external: true
    name: ctr-network