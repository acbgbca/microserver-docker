---
services:
  speedtest:
    image: openspeedtest/latest:latest@sha256:1127de0693c36bcf8c297c73d09891df8ec243680d027a6b6fab13fa0954ff46
    container_name: speedtest
    labels:
      - traefik.enable=true
      - traefik.http.services.speedtest.loadbalancer.server.port=3000
      - traefik.http.middlewares.limit.buffering.maxRequestBodyBytes=10000000000
      - traefik.http.routers.speedtest.middlewares=limit
      - show.external=true
    restart: unless-stopped
networks:
  default:
    external: true
    name: ctr-network