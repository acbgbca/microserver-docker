services:
  ptv:
    image: ghcr.io/acbgbca/ptv-monitor:latest@sha256:a8094bcf83b3088277772fca42ef0f61f3a9080584487a83db9cc3ea54c8609b
    container_name: ptv
    user: 9001:9001
    restart: unless-stopped
    env_file:
      - ptv.env
    labels:
      - traefik.enable=true
      - traefik.http.services.ptv.loadbalancer.server.port=8080
      - show.external=true
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - ./data:/data

networks:
  default:
    external: true
    name: ctr-network
