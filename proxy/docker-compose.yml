services:
  gluetun:
    image: qmcgaw/gluetun:v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "8888:8888"   # HTTP proxy port (Tinyproxy, exposed via Gluetun's network)
    env_file: gluetun.env
    volumes:
      - ./data:/gluetun
    restart: unless-stopped

  proxy:
    image: ubuntu/squid:latest@sha256:6a097f68bae708cedbabd6188d68c7e2e7a38cedd05a176e1cc0ba29e3bbe029
    container_name: squid
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_started # sometimes gluetun takes a while to become healthy. Start proxy anyway
    volumes:
      - ./squid.conf:/etc/squid/squid.conf:ro
    restart: unless-stopped

