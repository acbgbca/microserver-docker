---
services:
  minecraft:
    image: ghcr.io/acbgbca/minecraft-bedrock:1.26.45.1@sha256:04299d1fc3be208d486a903e9661b954070b65e8b87ab99f660f38459cc5a3ba
    container_name: minecraft
    environment:
      - UID=9001
      - GID=9001
      - EULA=TRUE
    volumes:
      - ./config:/config
      - ./worlds:/worlds
    security_opt:
      - no-new-privileges:true
    restart: 'unless-stopped'
    networks:
      default:
          ipv4_address: 192.168.94.70
networks:
  default:
    name: lan-network
    external: true