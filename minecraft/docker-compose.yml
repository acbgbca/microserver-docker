---
services:
  minecraft:
    image: ghcr.io/acbgbca/minecraft-bedrock:1.26.62.1@sha256:46fb8a1540c224c53c7fe04c3aaee27c990972ece77ecaac594695397caeda89
    container_name: minecraft
    environment:
      - UID=9001
      - GID=9001
      - EULA=TRUE
    volumes:
      - ./config:/config
      - ./worlds:/worlds
    security_opt:
      - no-new-privileges:true
    restart: 'unless-stopped'
    networks:
      default:
          ipv4_address: 192.168.94.70
networks:
  default:
    name: lan-network
    external: true