---
services:
  minecraft:
    image: ghcr.io/acbgbca/minecraft-bedrock:1.26.44.3@sha256:421d977be0c7680554126195c3672895c9c400802c18bd54c0ab4271aba65994
    container_name: minecraft
    environment:
      - UID=9001
      - GID=9001
      - EULA=TRUE
    volumes:
      - ./config:/config
      - ./worlds:/worlds
    security_opt:
      - no-new-privileges:true
    restart: 'unless-stopped'
    networks:
      default:
          ipv4_address: 192.168.94.70
networks:
  default:
    name: lan-network
    external: true