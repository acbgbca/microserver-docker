---
services:
  minecraft:
    image: ghcr.io/acbgbca/minecraft-bedrock:1.26.52.3@sha256:18915bb8069dda146a2c384050bca19501a1ff0e4afb4eef9064576245917e0a
    container_name: minecraft
    environment:
      - UID=9001
      - GID=9001
      - EULA=TRUE
    volumes:
      - ./config:/config
      - ./worlds:/worlds
    security_opt:
      - no-new-privileges:true
    restart: 'unless-stopped'
    networks:
      default:
          ipv4_address: 192.168.94.70
networks:
  default:
    name: lan-network
    external: true