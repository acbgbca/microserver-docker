---
services:
  minecraft:
    image: ghcr.io/acbgbca/minecraft-bedrock:1.26.61.1@sha256:1d52598dba0fc91c1770dff151d0e9f019254b7ab2a97e3295ce21dd163b5120
    container_name: minecraft
    environment:
      - UID=9001
      - GID=9001
      - EULA=TRUE
    volumes:
      - ./config:/config
      - ./worlds:/worlds
    security_opt:
      - no-new-privileges:true
    restart: 'unless-stopped'
    networks:
      default:
          ipv4_address: 192.168.94.70
networks:
  default:
    name: lan-network
    external: true