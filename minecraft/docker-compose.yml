---
services:
  minecraft:
    image: ghcr.io/acbgbca/minecraft-bedrock:1.26.40.8@sha256:4e5e24f03ac0fe5fe8cc8a01b87c3a2b3d0757dc09853bf85a86466c7dfe0756
    container_name: minecraft
    environment:
      - UID=9001
      - GID=9001
      - EULA=TRUE
    volumes:
      - ./config:/config
      - ./worlds:/worlds
    security_opt:
      - no-new-privileges:true
    restart: 'unless-stopped'
    networks:
      default:
          ipv4_address: 192.168.94.70
networks:
  default:
    name: lan-network
    external: true