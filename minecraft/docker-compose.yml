---
services:
  minecraft:
    image: ghcr.io/acbgbca/minecraft-bedrock:1.26.44.3@sha256:861638e9694fa7df1f1d7a574b28d67eff6811d0dfb3d9694194cb998f8c137a
    container_name: minecraft
    environment:
      - UID=9001
      - GID=9001
      - EULA=TRUE
    volumes:
      - ./config:/config
      - ./worlds:/worlds
    security_opt:
      - no-new-privileges:true
    restart: 'unless-stopped'
    networks:
      default:
          ipv4_address: 192.168.94.70
networks:
  default:
    name: lan-network
    external: true