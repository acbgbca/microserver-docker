---
services:
  minecraft:
    image: ghcr.io/acbgbca/minecraft-bedrock:1.26.52.3@sha256:00ce0b3722afd6511516f78f2a3970d0a07de15c01f3ec1f53f2bf18cb864737
    container_name: minecraft
    environment:
      - UID=9001
      - GID=9001
      - EULA=TRUE
    volumes:
      - ./config:/config
      - ./worlds:/worlds
    security_opt:
      - no-new-privileges:true
    restart: 'unless-stopped'
    networks:
      default:
          ipv4_address: 192.168.94.70
networks:
  default:
    name: lan-network
    external: true