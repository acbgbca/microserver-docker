---
services:
  minecraft:
    image: ghcr.io/acbgbca/minecraft-bedrock:1.26.36.1@sha256:315e90c5630e104c6de7a2efab4d01800fa2f31890e3b00f4c83b6dce38d2d84
    container_name: minecraft
    environment:
      - UID=9001
      - GID=9001
      - EULA=TRUE
    volumes:
      - ./config:/config
      - ./worlds:/worlds
    security_opt:
      - no-new-privileges:true
    restart: 'unless-stopped'
    networks:
      default:
          ipv4_address: 192.168.94.70
networks:
  default:
    name: lan-network
    external: true