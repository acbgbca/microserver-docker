---
services:
  minecraft:
    image: ghcr.io/acbgbca/minecraft-bedrock:1.26.63.1@sha256:2ceca2eae39f0a58251d4d213d83f5cc9f6c5a6c755736334d225f5b22fb836b
    container_name: minecraft
    environment:
      - UID=9001
      - GID=9001
      - EULA=TRUE
    volumes:
      - ./config:/config
      - ./worlds:/worlds
    security_opt:
      - no-new-privileges:true
    restart: 'unless-stopped'
    networks:
      default:
          ipv4_address: 192.168.94.70
networks:
  default:
    name: lan-network
    external: true