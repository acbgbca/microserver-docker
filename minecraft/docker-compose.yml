---
services:
  minecraft:
    image: ghcr.io/acbgbca/minecraft-bedrock:1.26.43.1@sha256:e08c2635de4b95f087dc0e897f5b10ab83a1aee2a5387f4bc21b8861217db7ce
    container_name: minecraft
    environment:
      - UID=9001
      - GID=9001
      - EULA=TRUE
    volumes:
      - ./config:/config
      - ./worlds:/worlds
    security_opt:
      - no-new-privileges:true
    restart: 'unless-stopped'
    networks:
      default:
          ipv4_address: 192.168.94.70
networks:
  default:
    name: lan-network
    external: true