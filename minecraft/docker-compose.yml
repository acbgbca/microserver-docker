---
services:
  minecraft:
    image: ghcr.io/acbgbca/minecraft-bedrock:1.26.45.1@sha256:c58fe57cb37b5cb8dadc21c78882603b4c40595641b57655df3aafdc63387ade
    container_name: minecraft
    environment:
      - UID=9001
      - GID=9001
      - EULA=TRUE
    volumes:
      - ./config:/config
      - ./worlds:/worlds
    security_opt:
      - no-new-privileges:true
    restart: 'unless-stopped'
    networks:
      default:
          ipv4_address: 192.168.94.70
networks:
  default:
    name: lan-network
    external: true