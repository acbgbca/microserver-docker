---
services:
  minecraft:
    image: ghcr.io/acbgbca/minecraft-bedrock:1.26.60.6@sha256:ecaf01e848fefeb59e2f504657d83c654424038f6011d5c8baf717b24bdc77c5
    container_name: minecraft
    environment:
      - UID=9001
      - GID=9001
      - EULA=TRUE
    volumes:
      - ./config:/config
      - ./worlds:/worlds
    security_opt:
      - no-new-privileges:true
    restart: 'unless-stopped'
    networks:
      default:
          ipv4_address: 192.168.94.70
networks:
  default:
    name: lan-network
    external: true