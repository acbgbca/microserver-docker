---
services:
  minecraft:
    image: ghcr.io/acbgbca/minecraft-bedrock:1.26.52.3@sha256:67da7e123ff40ee14cbc59b9e049e98de419507c0c594276661c6e3fbfbeca63
    container_name: minecraft
    environment:
      - UID=9001
      - GID=9001
      - EULA=TRUE
    volumes:
      - ./config:/config
      - ./worlds:/worlds
    security_opt:
      - no-new-privileges:true
    restart: 'unless-stopped'
    networks:
      default:
          ipv4_address: 192.168.94.70
networks:
  default:
    name: lan-network
    external: true