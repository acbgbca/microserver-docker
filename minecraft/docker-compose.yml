---
services:
  minecraft:
    image: ghcr.io/acbgbca/minecraft-bedrock:1.26.51.1@sha256:47cde64582be51a540b8f9c9428b06716f588aa99d722bff3712f709e49e2b5c
    container_name: minecraft
    environment:
      - UID=9001
      - GID=9001
      - EULA=TRUE
    volumes:
      - ./config:/config
      - ./worlds:/worlds
    security_opt:
      - no-new-privileges:true
    restart: 'unless-stopped'
    networks:
      default:
          ipv4_address: 192.168.94.70
networks:
  default:
    name: lan-network
    external: true