---
services:
  minecraft:
    image: ghcr.io/acbgbca/minecraft-bedrock:1.26.52.3@sha256:9b039fe31220e312e139af5a187d026fe3f6d9f94c1af44280a00ecc8410b41e
    container_name: minecraft
    environment:
      - UID=9001
      - GID=9001
      - EULA=TRUE
    volumes:
      - ./config:/config
      - ./worlds:/worlds
    security_opt:
      - no-new-privileges:true
    restart: 'unless-stopped'
    networks:
      default:
          ipv4_address: 192.168.94.70
networks:
  default:
    name: lan-network
    external: true