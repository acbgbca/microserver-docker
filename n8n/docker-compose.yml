services:
  n8n:
    image: ghcr.io/n8n-io/n8n:2.45.3@sha256:bf88c3783fc4b2a90a007bb99b04ad2f6a9627f41499baf72ca67559c51c7f4c
    container_name: n8n
    labels:
      - traefik.enable=true
      - traefik.http.services.n8n.loadbalancer.server.port=5678
      - show.external=true
    env_file:
      - n8n.env
    volumes:
      - ./data:/home/node/.n8n
      - /mnt/data8tb/videos:/videos:rw
    restart: 'unless-stopped'
networks:
  default:
    external: true
    name: ctr-network