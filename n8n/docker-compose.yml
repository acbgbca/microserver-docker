services:
  n8n:
    image: ghcr.io/n8n-io/n8n:3.3.0@sha256:e06707c78ef5adb302b47909f8fee5caf8d389a7e5f3f0e03165214f6178565e
    container_name: n8n
    labels:
      - traefik.enable=true
      - traefik.http.services.n8n.loadbalancer.server.port=5678
      - show.external=true
    env_file:
      - n8n.env
    volumes:
      - ./data:/home/node/.n8n
      - /mnt/data8tb/videos:/videos:rw
    restart: 'unless-stopped'
networks:
  default:
    external: true
    name: ctr-network