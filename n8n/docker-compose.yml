services:
  n8n:
    image: ghcr.io/n8n-io/n8n:2.34.3@sha256:fa7ce58e445c3855e6fcdab86f3b2e25a0dc13e80300b72d8336deea81885f1e
    container_name: n8n
    labels:
      - traefik.enable=true
      - traefik.http.services.n8n.loadbalancer.server.port=5678
      - show.external=true
    env_file:
      - n8n.env
    volumes:
      - ./data:/home/node/.n8n
    restart: 'unless-stopped'
networks:
  default:
    external: true
    name: ctr-network