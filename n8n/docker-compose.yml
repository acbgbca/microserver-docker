services:
  n8n:
    image: ghcr.io/n8n-io/n8n:3.4.1@sha256:95f4fabd308669b35761ccf5b0d0a63526da06135e7e44d19d14694dbfd340be
    container_name: n8n
    labels:
      - traefik.enable=true
      - traefik.http.services.n8n.loadbalancer.server.port=5678
      - show.external=true
    env_file:
      - n8n.env
    volumes:
      - ./data:/home/node/.n8n
      - /mnt/data8tb/videos:/videos:rw
    restart: 'unless-stopped'
networks:
  default:
    external: true
    name: ctr-network