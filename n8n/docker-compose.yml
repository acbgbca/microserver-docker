services:
  n8n:
    image: ghcr.io/n8n-io/n8n:2.46.2@sha256:7835b0b05cb0a13133c7b9751c203b5b5d206ce3eb1b5f7fc0e5b01e8c6acdde
    container_name: n8n
    labels:
      - traefik.enable=true
      - traefik.http.services.n8n.loadbalancer.server.port=5678
      - show.external=true
    env_file:
      - n8n.env
    volumes:
      - ./data:/home/node/.n8n
      - /mnt/data8tb/videos:/videos:rw
    restart: 'unless-stopped'
networks:
  default:
    external: true
    name: ctr-network