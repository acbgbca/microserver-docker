services:
  n8n:
    image: ghcr.io/n8n-io/n8n:2.44.2@sha256:b57e7a9c8e5ab1a8fe9b03fff3158052aec65f571ed1f759897a20f306ad329d
    container_name: n8n
    labels:
      - traefik.enable=true
      - traefik.http.services.n8n.loadbalancer.server.port=5678
      - show.external=true
    env_file:
      - n8n.env
    volumes:
      - ./data:/home/node/.n8n
      - /mnt/data8tb/videos:/videos:rw
    restart: 'unless-stopped'
networks:
  default:
    external: true
    name: ctr-network