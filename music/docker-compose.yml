services:
  beets:
    image: lscr.io/linuxserver/beets:2.14.1@sha256:ae076820ec34ea5e9ec05a22931e98ab555e9c25e784c5fb001c84f411119c73
    container_name: beets
    user: 9001:9001
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.services.beets.loadbalancer.server.port=8337
      - show.external=true
    environment:
      TZ: "Australia/Melbourne"
    volumes:
      - ./config:/config
      - /mnt/data8tb/music_tagged:/music
      - /mnt/data8tb/downloads:/downloads
      - /mnt/data8tb/music_untagged:/untagged
  slskd:
    image: slskd/slskd:0.26.1@sha256:588af49abc3088d639c8f1174d3bfad6e92c093a275a593140e3ac9311ebf6c4
    container_name: slskd
    user: 9001:9001
    restart: unless-stopped
    ports:
      - 50300:50300
    labels:
      - traefik.enable=true
      - traefik.http.services.slskd.loadbalancer.server.port=5030
      - show.external=true
    environment:
      - SLSKD_REMOTE_CONFIGURATION=true
    volumes:
      - ./slskd:/app
      - /mnt/data8tb/music_untagged:/downloads
  aurral:
    image: ghcr.io/lklynet/aurral:2.10.0@sha256:e15f05e525a7c9d4a97e36ff18b6a37904dda6c803e46f0fd87900a7021febae
    container_name: aurral
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.services.aurral.loadbalancer.server.port=3001
      - show.external=true
    environment:
      - PUID=9001
      - PGID=9001
      - AUTH_PROXY_ENABLE=true
      - AUTH_PROXY_HEADER=REMOTE-USER
      - AUTH_PROXY_ADMIN_GROUPS=REMOTE-GROUPS
    volumes:
      - /mnt/data8tb/downloads:/app/downloads
      - ./aurral:/config
  lidarr:
    image: lscr.io/linuxserver/lidarr:latest@sha256:67887807b13ae025c0fe979da298347c8609969087ab064c81d8e9acc1e06bbf
    container_name: lidarr
    labels:
      - traefik.enable=true
      - traefik.http.services.lidarr.loadbalancer.server.port=8686
      - show.external=true
    environment:
      - PUID=9001
      - PGID=9001
      - TZ=Australia/Melbourne
    volumes:
      - ./lidarr:/config
      - /mnt/data8tb/music:/music
      - '/mnt/data8tb/downloads:/media'
    restart: unless-stopped
  musicassistant:
    image: ghcr.io/music-assistant/server:2.10.6
    container_name: musicassistant
    labels:
      - traefik.enable=true
      - traefik.http.services.musicassistant.loadbalancer.server.port=8095
    restart: unless-stopped
    volumes:
      - ./musicassistant:/data/
      - /mnt/data8tb/music:/media:ro
    environment:
      - LOG_LEVEL=info
    networks:
      lan:
        ipv4_address: 192.168.94.73
      default:
        aliases:
          - musicassistant.$internalDomain
    hostname: musicassistant.${internalDomain}

networks:
  default:
    external: true
    name: ctr-network
  lan:
    name: lan-network
    external: true
