services:
  beets:
    image: lscr.io/linuxserver/beets:2.14.1@sha256:3e21faa842c31d11ca99c17a2c299f54871af5434554ae265b103e8f8322fa48
    container_name: beets
    user: 9001:9001
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.services.beets.loadbalancer.server.port=8337
      - show.external=true
    environment:
      TZ: "Australia/Melbourne"
    volumes:
      - ./config:/config
      - /mnt/data8tb/music_tagged:/music
      - /mnt/data8tb/downloads:/downloads
      - /mnt/data8tb/music_untagged:/untagged
  slskd:
    image: slskd/slskd:0.26.0@sha256:ecd4026d4f8fb504e2cc55323efa2c1f5b56d20d3686b018249cc36b48ea17a6
    container_name: slskd
    user: 9001:9001
    restart: unless-stopped
    ports:
      - 50300:50300
    labels:
      - traefik.enable=true
      - traefik.http.services.slskd.loadbalancer.server.port=5030
      - show.external=true
    environment:
      - SLSKD_REMOTE_CONFIGURATION=true
    volumes:
      - ./slskd:/app
      - /mnt/data8tb/music_untagged:/downloads
  aurral:
    image: ghcr.io/lklynet/aurral:2.9.1@sha256:5690b43d50c76f81af3d0163ae05061f3227e8631da5bffbdd67c0d6407a334e
    container_name: aurral
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.services.aurral.loadbalancer.server.port=3001
      - show.external=true
    environment:
      - PUID=9001
      - PGID=9001
      - AUTH_PROXY_ENABLE=true
      - AUTH_PROXY_HEADER=REMOTE-USER
      - AUTH_PROXY_ADMIN_GROUPS=REMOTE-GROUPS
    volumes:
      - /mnt/data8tb/downloads:/app/downloads
      - ./aurral:/config
  lidarr:
    image: lscr.io/linuxserver/lidarr:latest@sha256:8ab0fd370b604ae034d9a9c261a9d8d873bece33d9736852e7ce4f3566e4a35d
    container_name: lidarr
    labels:
      - traefik.enable=true
      - traefik.http.services.lidarr.loadbalancer.server.port=8686
      - show.external=true
    environment:
      - PUID=9001
      - PGID=9001
      - TZ=Australia/Melbourne
    volumes:
      - ./lidarr:/config
      - /mnt/data8tb/music:/music
      - '/mnt/data8tb/downloads:/media'
    restart: unless-stopped

networks:
  default:
    external: true
    name: ctr-network
