---
services:
  smtprelay:
    image: grafana/smtprelay:2.5.4@sha256:119a68c907fbf3446b74b30769eefc6049d81f3291b24aa35e67d5bd17a882b2
    container_name: smtprelay
    hostname: smtprelay
    ports:
      - 2025:25
    command: -config=/smtprelay.ini
    volumes:
      - ./smtprelay.ini:/smtprelay.ini:ro
    restart: 'unless-stopped'
networks:
  default:
    external: true
    name: ctr-network
